# The service and an observability stack (OpenTelemetry collector, Prometheus, Tempo, Loki, Grafana in
# one image). Scripted mode by default: no key, no cost. For live extraction, copy .env.example to .env
# and set EXTRACTION_MODE=live and ANTHROPIC_API_KEY there; .env is never committed.
services:
  intake:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      Extraction__Mode: ${EXTRACTION_MODE:-scripted}
      Extraction__Model: ${EXTRACTION_MODEL:-claude-haiku-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    depends_on:
      - observability

  observability:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "127.0.0.1:3000:3000"   # Grafana
      - "127.0.0.1:9090:9090"   # Prometheus, for checking what arrived
    volumes:
      - ./grafana/ticketdesk-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ticketdesk.yaml:ro
      - ./grafana/ticketdesk-dashboard.json:/otel-lgtm/ticketdesk-dashboard.json:ro
